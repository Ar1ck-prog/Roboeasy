# Render Blueprint: dashboard → New → Blueprint → this repository.
# Secrets marked `sync: false` are asked for in the dashboard (never commit them).
services:
  - type: web
    name: roboeasy
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /ru
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # AI generator and mentor (https://aistudio.google.com/apikey).
      - key: GEMINI_API_KEY
        sync: false
      # Optional: a separate key for the mentor, so its chats do not use the generator's quota.
      - key: GEMINI_MENTOR_API_KEY
        sync: false
      # Which Gemini models to use (the code contains no model names).
      - key: GEMINI_MODEL_MAIN
        value: gemini-3.5-flash
      - key: GEMINI_MODEL_LIGHT
        value: gemini-flash-lite-latest
      - key: GEMINI_MODEL_FALLBACKS
        value: gemini-flash-latest
      # AI cache, shared rate limits and usage counters (Supabase → Project Settings → API).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Signs certificate codes; Render generates a random value once.
      - key: CERT_SECRET
        generateValue: true
      # Accounts and cloud sync (Supabase → Project Settings → API). Both are public
      # by design (the browser uses them) but are read at build time: redeploy after changing.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
