# Render Blueprint: dashboard → New → Blueprint → this repository.
# Secrets marked `sync: false` are asked for in the dashboard (never commit them).
services:
  - type: web
    name: roboeasy
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /ru
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # AI generator and mentor (https://aistudio.google.com/apikey).
      - key: GEMINI_API_KEY
        sync: false
      # Signs certificate codes; Render generates a random value once.
      - key: CERT_SECRET
        generateValue: true
      # Accounts and cloud sync (Supabase → Project Settings → API). Both are public
      # by design (the browser uses them) but are read at build time: redeploy after changing.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
