<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoboEasy</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #141826;
        color: #fff7e8;
        font-family: system-ui, sans-serif;
        padding: 16px;
        text-align: center;
      }
      h1 {
        color: #ffc531;
        margin: 0 0 16px;
      }
      p {
        margin: 8px 0;
      }
      button {
        margin-top: 16px;
        padding: 12px 20px;
        border-radius: 12px;
        border: 2px solid #fff7e8;
        background: #ffc531;
        color: #1b1f2a;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RoboEasy</h1>
      <p lang="ru">Нет интернета. Проверь связь и попробуй снова.</p>
      <p lang="kk">Интернет жоқ. Байланысты тексеріп, қайталап көр.</p>
      <p lang="en">No internet connection. Check it and try again.</p>
      <button type="button" onclick="location.reload()">↻</button>
    </main>
  </body>
</html>
